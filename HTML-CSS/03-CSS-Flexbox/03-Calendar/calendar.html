<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calendar.css">
    <title>Calendar</title>
</head>

<body>

    <div class="calendar">

        <div class="calendar-main">

            <div class="workweek">
                Workweek
            </div>

            <div class="weekdays">
                <div>1 Monday</div>
                <div>2 Tuesday</div>
                <div>3 Wednesday</div>
                <div>4 Thursday</div>
                <div>5 Friday</div>
            </div>

            <div class="weekend">
                Weekend
            </div>

            <div class="weekend-days">
                <div>6 Saturday</div>
                <div>7 Sunday</div>
            </div>

        </div>

        <div class="calendar-side">
            <div class="reminders">REMINDERS</div>
            <div class="special-dates">SPECIAL DATES</div>
        </div>

    </div>

</body>

</html>
